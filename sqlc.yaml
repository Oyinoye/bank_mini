version: "2"
sql:
  - schema: "db/migration"        # Path to your DDL (CREATE TABLE, etc.)
    queries: "db/query"       # Path to your DML (SELECT, INSERT, etc.)
    engine: "postgresql"       # or "mysql"
    gen:
      go:
        package: "db"          # Name of the generated Go package
        out: "db/sqlc"              # Directory where files will be created
        sql_package: "pgx/v5"  # "database/sql" Recommended for modern Go/Postgres apps but now use pgx/v5
        emit_json_tags: true   # Adds `json:"column_name"` to structs
        emit_prepared_queries: false
        emit_interface: true   # Great for mocking in tests
        emit_empty_slices: true
        emit_exact_table_names: false
        overrides:
            - db_type: "timestamptz"
              go_type: "time.Time"
            - db_type: "uuid"
              go_type: "github.com/google/uuid.UUID"
            # Config for NOT NULL numeric columns
            - db_type: "numeric"
              go_type: "string"
              nullable: false
            # # Config for NULLABLE numeric columns
            # - db_type: "numeric"
            #   go_type: "*string"
            #   nullable: true
            #   pointer: true
